<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AskUserQuestion — referência LionCodeLabs</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --surface-2: #f1f1f3; --border: #e2e2e6;
    --fg: #1a1a1d; --muted: #6b6b73; --accent: #ff6b00; --accent-2: #ff8c2e;
    --xs: 4px; --sm: 8px; --md: 16px; --lg: 24px;
    --radius-sm: 5px; --radius-lg: 12px;
    font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
  }
  .dark {
    --bg: #0a0a0b; --surface: #121214; --surface-2: #17171a; --border: #232327;
    --fg: #ededee; --muted: #a1a1aa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); }
  .backdrop {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(0,0,0,.6); padding: var(--lg); backdrop-filter: blur(2px);
  }
  .dialog {
    display: flex; flex-direction: column; width: 100%; max-width: 32rem; max-height: 85vh;
    overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--border);
    background: var(--surface); box-shadow: 0 30px 70px -30px rgba(0,0,0,.8);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); padding: var(--md) var(--lg);
  }
  .header h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .queue {
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2);
    padding: 2px var(--sm); font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 10px; font-weight: 600; color: var(--muted);
  }
  .body { display: flex; flex-direction: column; gap: var(--lg); overflow: auto; padding: var(--lg); }
  fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: var(--sm); }
  .chip {
    display: inline-block; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); padding: 1px var(--sm); font-family: ui-monospace, monospace;
    font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--muted);
  }
  .prompt { margin: 0; font-size: 14px; font-weight: 500; }
  .opt {
    display: flex; align-items: flex-start; gap: var(--sm); cursor: pointer;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface-2); padding: var(--sm) var(--md);
  }
  .opt.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .opt input { margin-top: 3px; accent-color: var(--accent); }
  .opt-label { font-size: 14px; font-weight: 500; }
  .opt-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .other {
    border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2);
    padding: var(--sm) var(--md); font-size: 14px; color: var(--fg); width: 100%;
  }
  .other::placeholder { color: var(--muted); }
  .footer {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sm);
    border-top: 1px solid var(--border); background: var(--surface-2);
    padding: var(--md) var(--lg);
  }
  .hint { font-size: 12px; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); border: 1px solid transparent;
    background: var(--accent); color: var(--bg); padding: var(--sm) var(--md);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
      <div class="header">
        <h3 id="title">O agente precisa da sua resposta</h3>
        <span class="queue">+1 na fila</span>
      </div>
      <div class="body">
        <fieldset>
          <legend><span class="chip">Migração</span></legend>
          <p class="prompt">Qual estratégia de migração devo usar?</p>
          <label class="opt checked">
            <input type="radio" name="q0" checked />
            <span>
              <div class="opt-label">Big bang</div>
              <div class="opt-desc">Troca tudo de uma vez; risco concentrado.</div>
            </span>
          </label>
          <label class="opt">
            <input type="radio" name="q0" />
            <span>
              <div class="opt-label">Incremental por módulo</div>
              <div class="opt-desc">Migra módulo a módulo com rollback local.</div>
            </span>
          </label>
          <label class="opt">
            <input type="radio" name="q0" />
            <span>
              <div class="opt-label">Feature flag</div>
              <div class="opt-desc">Liga o novo caminho gradualmente.</div>
            </span>
          </label>
          <input class="other" type="text" placeholder="Outro… (texto livre)" />
        </fieldset>
      </div>
      <div class="footer">
        <span class="hint">Pronto para enviar</span>
        <button class="btn" type="button">Responder</button>
      </div>
    </div>
  </div>
</body>
</html>
